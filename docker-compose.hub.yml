# 免构建方案：直接拉取 GHCR 预构建镜像（由 CI 自动发布，支持 amd64 / arm64）。
#
#   docker compose -f docker-compose.hub.yml up -d
#
# 服务器上不需要 Node、不需要源码，只有这一个文件即可。
# 升级：docker compose -f docker-compose.hub.yml pull && docker compose -f docker-compose.hub.yml up -d
#
# 想改端口 / 管理员密码，把 .env.example 复制成 .env 再改（本文件同样会读取）。

name: tg-checkin

services:
  tg-checkin:
    image: ghcr.io/tmclsamxy/tg-checkin:latest
    pull_policy: always
    container_name: tg-checkin
    restart: unless-stopped

    ports:
      - "${PORT:-8000}:8000"

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SECRET_KEY: ${SECRET_KEY:-}

    volumes:
      - ./data:/app/data
