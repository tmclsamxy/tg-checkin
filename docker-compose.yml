services:
  tg-checkin:
    build: .
    image: tg-checkin:latest
    container_name: tg-checkin
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - ./data:/app/data
