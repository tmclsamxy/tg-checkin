# 默认方案：从源码构建，服务器需要有仓库源码。
#
#   docker compose up -d          # 构建（若本地无镜像）并后台启动
#   docker compose up -d --build  # 源码改动后强制重新构建
#   docker compose logs -f        # 看日志
#   docker compose down           # 停止并移除容器
#
# 所有变量都有默认值，不创建 .env 也能直接跑起来；
# 想改端口 / 管理员密码，把 .env.example 复制成 .env 再改。
#
# 不想在服务器上构建？用 docker-compose.hub.yml 直接拉 GHCR 预构建镜像。

name: tg-checkin

services:
  tg-checkin:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-checkin:latest
    container_name: tg-checkin
    restart: unless-stopped

    ports:
      - "${PORT:-8000}:8000"

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SECRET_KEY: ${SECRET_KEY:-}

    volumes:
      - ./data:/app/data
